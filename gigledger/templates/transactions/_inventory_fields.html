{#
  The one copy of the inventory fields (quantity, unit cost, "Bought for"
  project, consumable) rendered into both the add and edit modals.
#}
{% macro inventory_fields(prefix) %}
            <div id="{{ prefix }}_inventory_section" class="hidden space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1.5">Quantity</label>
                        <input type="number" name="quantity" id="{{ prefix }}_quantity" step="0.01" min="0.01" class="candy-input block w-full px-3 py-2.5 text-gray-900 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1.5">Unit cost ({{ currency }})</label>
                        <input type="number" name="unit_cost" id="{{ prefix }}_unit_cost" step="0.01" min="0.01" class="candy-input block w-full px-3 py-2.5 text-gray-900 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1.5">Bought for</label>
                    <select name="project_id" id="{{ prefix }}_project" class="candy-input block w-full px-3 py-2.5 text-gray-900 focus:outline-none">
                        <option value="">General Inventory</option>
                        {% for p in projects %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" name="is_consumable" id="{{ prefix }}_consumable" class="h-4 w-4 text-amber-600 border-gray-300 rounded focus:ring-amber-500">
                    <label for="{{ prefix }}_consumable" class="text-sm font-medium text-gray-600">Consumable &mdash; used up on a project, not returned</label>
                </div>
            </div>
{% endmacro %}
